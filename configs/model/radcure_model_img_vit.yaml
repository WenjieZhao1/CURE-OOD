_target_: src.models.deepmtlr_model_vit.DEEP_MTLR

model: "UNETR_Img"
dense_factor : 1 #Factor to multiply width of fc layer.
n_dense : 2   #Number of fc layers.
dropout : 0.25
C1 : 1 #Regularization term for MTLR backprop.
lr : 1e-3
weight_decay: 0.01
time_bins: 8
loss_gamma: 0.1
in_channels: 2
out_channels: 0
num_classes: 2  # Number of classes for classification

hazard_reference_mode: none
hazard_reference_dir: null
extended_scores_enabled: false
metric_bootstrap_n: 0
metric_bootstrap_seed: 786

#CNN
k1 : 3
k2 : 5

step: 20, 50, 100, 150, 200  

#ViT
patch_size : 8
patch_xy: 80 # whole image
patch_z: 48 # whole image
hidden_size : 768
mlp_dim : 3072
num_layers : 12
num_heads : 12
